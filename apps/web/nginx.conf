# Nginx interno do container "web": serve o app e encaminha /api para o container "api".
# O HTTPS e os headers de segurança ficam no Nginx da VPS (deploy/nginx.conf.example).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Mantém o IP real do cliente vindo do Nginx da VPS. A porta só é publicada em 127.0.0.1,
  # então o único cliente possível é o Nginx da VPS, que sobrescreve o X-Forwarded-For.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Service worker e manifest nunca podem ficar presos em cache
  location ~* ^/(sw\.js|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
