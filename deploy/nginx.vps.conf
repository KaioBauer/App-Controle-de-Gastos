# kaixa.tech -> container kaixa-web (/opt/kaixa)
# Instalado em /opt/proxy/sites/kaixa.conf na VPS. A porta 80 (redirect + desafio do certbot)
# e o resolver do Docker ficam no nginx.conf global do proxy.

limit_req_zone $binary_remote_addr zone=kaixa_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kaixa_webhook:10m rate=60r/m;

server {
  listen 443 ssl;
  server_name kaixa.tech www.kaixa.tech;
  ssl_certificate     /etc/letsencrypt/live/kaixa.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kaixa.tech/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  client_max_body_size 1m;

  # www -> raiz (app, cookies e push numa origem só)
  if ($host = www.kaixa.tech) {
    return 301 https://kaixa.tech$request_uri;
  }

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  set $upstream http://kaixa-web:80;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  # Sobrescreve (não concatena) para o cliente não forjar o próprio IP
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  location = /api/auth/login {
    limit_req zone=kaixa_login burst=5 nodelay;
    proxy_pass $upstream;
  }

  # Webhook da Pluggy: só o IP oficial dela (docs.pluggy.ai/docs/webhooks)
  location = /api/webhooks/pluggy {
    allow 52.67.145.81;
    deny all;
    limit_req zone=kaixa_webhook burst=20 nodelay;
    proxy_pass $upstream;
  }

  location / {
    proxy_pass $upstream;
  }
}
